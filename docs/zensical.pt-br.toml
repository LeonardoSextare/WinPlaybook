# Portuguese (Brazil) documentation. Zensical builds one language per site, so the
# English site has its own config, zensical.en.toml. Keep the theme and the Markdown
# extensions the same in both files.
#
# Build or preview with: uvx zensical serve -f docs/zensical.pt-br.toml

[project]
site_url = "https://leonardosextare.github.io/WinPlaybook/pt-br/"
site_name = "WinPlaybook"
site_description = "Use o Ansible no Windows como se estivesse instalado localmente."
site_author = "Leonardo Sextare"

copyright = 'Copyright &copy; 2026 Leonardo Sextare. Distribuído sob a <a href="https://github.com/LeonardoSextare/WinPlaybook/blob/main/LICENSE">Licença MIT</a>.'

repo_url = "https://github.com/LeonardoSextare/WinPlaybook"
repo_name = "WinPlaybook"
edit_uri = "edit/main/docs/pt-br/"

docs_dir = "pt-br"
site_dir = "site/pt-br"

# Each top-level entry becomes a tab; the pages of the active tab fill the left sidebar.
# The file names are the same as in English, so the language selector keeps the page.
nav = [
  { "Início" = "index.md" },
  { "Primeiros passos" = [
    "getting-started/installation.md",
    "getting-started/first-playbook.md",
  ] },
  { "Guias" = [
    "guides/vscode.md",
    "guides/run-commands.md",
    "guides/customize-shims.md",
    "guides/uninstall.md",
  ] },
  { "Como funciona" = [
    "how-it-works/shims-and-container.md",
    "how-it-works/project-folder.md",
  ] },
  { "Referência" = [
    "reference/commands.md",
    "reference/image.md",
  ] },
  { "Solução de problemas" = "troubleshooting.md" },
]

extra_css = ["stylesheets/extra.css", "stylesheets/home.css"]
extra_javascript = ["javascripts/home.js"]

[project.theme]
# "modern" (default): Inter font and Lucide icons.
# "classic": Roboto font and Material icons, the look of Material for MkDocs.
variant = "modern"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "pt-BR"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # Renders the tabs inside the header, so they stay above the home hero.
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

[project.theme.icon]
logo = "lucide/terminal"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

# Without media queries the first entry is the default, so the site opens dark.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Mudar para o modo claro"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para o modo escuro"

[project.extra]
# Hides the "Made with Zensical" notice in the footer.
generator = false
# The same in both languages: the install script is published at the root of the site.
install_url = "https://leonardosextare.github.io/WinPlaybook/install.ps1"
# Language selector in the header.
alternate = [
  { name = "English", link = "/WinPlaybook/en/", lang = "en" },
  { name = "Português (Brasil)", link = "/WinPlaybook/pt-br/", lang = "pt" },
]

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
