name: Commits

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  titulos-dos-commits:
    name: Títulos dos commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confere os títulos dos commits
        env:
          INTERVALO: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ./scripts/Test-TituloDeCommit.ps1 -Intervalo $env:INTERVALO
