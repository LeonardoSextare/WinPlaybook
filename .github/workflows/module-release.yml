name: Module release

on:
  push:
    branches: [main]
    paths:
      - module/**
      - tests/**
      - scripts/Save-Shim.ps1
      - requirements.psd1
      - .github/actions/**
      - .github/workflows/module-ci.yml
      - .github/workflows/module-release.yml

permissions:
  contents: read

concurrency:
  group: module-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  GIT_CLIFF__BUMP__INITIAL_TAG: module-v0.1.0

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/module-ci.yml

  version:
    name: Version
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_info.outputs.should_release }}
      tag: ${{ steps.release_info.outputs.tag }}
      version: ${{ steps.release_info.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate the next version
        id: next_version
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --include-path "module/**"
            --tag-pattern "^module-v"
            --bumped-version

      - name: Compare with the latest release
        id: release_info
        env:
          NEXT_TAG: ${{ steps.next_version.outputs.content }}
        run: |
          $tag = $env:NEXT_TAG.Trim()
          $latest = git tag --list 'module-v*' --merged HEAD --sort=-version:refname | Select-Object -First 1
          $version = [version] ($tag -replace '^module-v')
          $shouldRelease = if ($tag -eq $latest) { 'false' } else { 'true' }

          Write-Host "Latest: $($latest ?? 'none'). Next: $tag. Should release: $shouldRelease."
          @(
              "should_release=$shouldRelease"
              "tag=$tag"
              "version=$version"
          ) | Add-Content $env:GITHUB_OUTPUT

  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --include-path "module/**"
            --tag-pattern "^module-v"
            --unreleased
            --bump
            --strip all
            --output release-notes.md

      - name: Prepare the module
        id: prepare
        run: |
          $modulePath = Join-Path $env:RUNNER_TEMP 'WinPlaybook'
          Copy-Item -Path module/WinPlaybook -Destination $modulePath -Recurse
          ./scripts/Save-Shim.ps1 -Destination (Join-Path $modulePath 'bin')

          $manifestPath = Join-Path $modulePath 'WinPlaybook.psd1'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw 

          $versionPattern = "(ModuleVersion\s*=\s*)'0\.0\.0'"
          if ($manifest -notmatch $versionPattern) {
              throw "WinPlaybook.psd1 must have ModuleVersion = '0.0.0'; the release writes the version."
          }

          $manifest -replace $versionPattern, "`${1}'$env:VERSION'" | Set-Content -LiteralPath $manifestPath -NoNewline
          Test-ModuleManifest -Path $manifestPath | Format-List Name, Version

          "module_path=$modulePath" | Add-Content $env:GITHUB_OUTPUT

      - name: Publish to the PowerShell Gallery
        env:
          MODULE_PATH: ${{ steps.prepare.outputs.module_path }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-PSResource -Path $env:MODULE_PATH -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG --title "Module $env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA
