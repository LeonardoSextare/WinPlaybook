name: Installer CI

on:
  pull_request:
    paths:
      - installer/**
      - module/**
      - tests/installer/**
      - tests/helpers/**
      - scripts/Build-ModulePackage.ps1
      - scripts/Save-Shim.ps1
      - requirements.psd1
      - .github/actions/**
      - .github/workflows/installer-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  integration-tests:
    name: Installer integration tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        uses: ./.github/actions/install-test-dependencies

      - name: Show the package tools of each edition
        run: |
          $listCommand = 'Get-Module -ListAvailable PowerShellGet, Microsoft.PowerShell.PSResourceGet | Format-Table Name, Version, ModuleBase -AutoSize | Out-String -Width 200'
          Write-Host '--- PowerShell 7'
          pwsh -NoProfile -Command $listCommand
          Write-Host '--- Windows PowerShell 5.1'
          powershell -NoProfile -Command $listCommand

      - name: Set up Docker Desktop
        uses: ./.github/actions/setup-docker-desktop

      - name: Run the tests (PowerShell 7)
        id: tests-core
        run: Invoke-Pester -Path tests/installer -CI -Output Detailed

      - name: Run the tests (Windows PowerShell 5.1)
        if: success() || steps.tests-core.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/installer -CI -Output Detailed

      - name: Upload the Docker Desktop logs
        if: failure()
        uses: ./.github/actions/upload-docker-desktop-logs
