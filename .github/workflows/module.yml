name: Module

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - module/**
      - tests/module/**
      - tests/shared/**
      - scripts/Save-Shim.ps1
      - scripts/Build-ModulePackage.ps1
      - requirements.psd1
      - .github/actions/**
      - .github/workflows/module.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  GIT_CLIFF__BUMP__INITIAL_TAG: module-v0.1.0

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        uses: ./.github/actions/install-test-dependencies

      - name: Run the tests (PowerShell 7)
        id: tests-core
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

      - name: Run the tests (Windows PowerShell 5.1)
        if: success() || steps.tests-core.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

  integration-tests:
    name: Integration tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        uses: ./.github/actions/install-test-dependencies

      - name: Download the shim
        run: ./scripts/Save-Shim.ps1

      - name: Set up Docker Desktop
        uses: ./.github/actions/setup-docker-desktop

      - name: Run the tests (PowerShell 7)
        id: tests-core
        run: Invoke-Pester -Path tests/module/integration -CI -Output Detailed

      - name: Run the tests (Windows PowerShell 5.1)
        if: success() || steps.tests-core.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/module/integration -CI -Output Detailed

      - name: Upload the Docker Desktop logs
        if: failure()
        uses: ./.github/actions/upload-docker-desktop-logs

  e2e-tests:
    name: E2E tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        uses: ./.github/actions/install-test-dependencies

      - name: Download the shim
        run: ./scripts/Save-Shim.ps1

      - name: Set up Docker Desktop
        uses: ./.github/actions/setup-docker-desktop

      - name: Run the tests (PowerShell 7)
        id: tests-core
        run: Invoke-Pester -Path tests/module/e2e -CI -Output Detailed

      - name: Run the tests (Windows PowerShell 5.1)
        if: success() || steps.tests-core.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/module/e2e -CI -Output Detailed

      - name: Upload the Docker Desktop logs
        if: failure()
        uses: ./.github/actions/upload-docker-desktop-logs

  version:
    name: Version
    needs: [unit-tests, integration-tests, e2e-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_info.outputs.should_release }}
      tag: ${{ steps.release_info.outputs.tag }}
      version: ${{ steps.release_info.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate the next version
        id: next_version
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --include-path "module/**"
            --tag-pattern "^module-v"
            --bumped-version

      - name: Compare with the latest release
        id: release_info
        env:
          NEXT_TAG: ${{ steps.next_version.outputs.content }}
        run: |
          $tag = $env:NEXT_TAG.Trim()
          $latest = git tag --list 'module-v*' --merged HEAD --sort=-version:refname | Select-Object -First 1
          $version = [version] ($tag -replace '^module-v')
          $shouldRelease = if ($tag -eq $latest) { 'false' } else { 'true' }

          Write-Host "Latest: $($latest ?? 'none'). Next: $tag. Should release: $shouldRelease."
          @(
              "should_release=$shouldRelease"
              "tag=$tag"
              "version=$version"
          ) | Add-Content $env:GITHUB_OUTPUT

  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --include-path "module/**"
            --tag-pattern "^module-v"
            --unreleased
            --bump
            --strip all
            --output release-notes.md

      - name: Prepare the module
        id: prepare
        run: |
          $modulePath = ./scripts/Build-ModulePackage.ps1 -Version $env:VERSION -Destination $env:RUNNER_TEMP
          "module_path=$modulePath" | Add-Content $env:GITHUB_OUTPUT

      - name: Publish to the PowerShell Gallery
        env:
          MODULE_PATH: ${{ steps.prepare.outputs.module_path }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-PSResource -Path $env:MODULE_PATH -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG --title "Module $env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA
