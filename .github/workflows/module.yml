name: Módulo

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - module/**
      - tests/module/**
      - scripts/Build-PacoteDoModulo.ps1
      - requirements.psd1
      - .github/actions/**
      - .github/workflows/module.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modulo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7

      - name: Instala as dependências de teste
        uses: ./.github/actions/instala-dependencias-de-teste

      - name: Roda os testes (PowerShell 7)
        id: testes-powershell-7
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

      - name: Roda os testes (Windows PowerShell 5.1)
        id: testes-powershell-5
        if: success() || steps.testes-powershell-7.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

      - name: Troca o módulo pelo pacote publicado
        id: pacote
        if: success() || steps.testes-powershell-7.conclusion == 'failure' || steps.testes-powershell-5.conclusion == 'failure'
        run: |
          $pacote = ./scripts/Build-PacoteDoModulo.ps1 -Versao 0.0.0 -PastaDeDestino (Join-Path $env:RUNNER_TEMP 'pacote')
          Remove-Item -LiteralPath module/WinPlaybook -Recurse -Force
          Copy-Item -LiteralPath $pacote -Destination module/WinPlaybook -Recurse

      - name: Roda os testes no pacote (PowerShell 7)
        id: pacote-powershell-7
        if: steps.pacote.conclusion == 'success'
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

      - name: Roda os testes no pacote (Windows PowerShell 5.1)
        if: steps.pacote.conclusion == 'success'
        shell: powershell
        run: Invoke-Pester -Path tests/module/unit -CI -Output Detailed

  testes-de-integracao:
    name: Testes de integração
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7

      - name: Instala as dependências de teste
        uses: ./.github/actions/instala-dependencias-de-teste

      - name: Roda os testes (PowerShell 7)
        id: testes-powershell-7
        run: Invoke-Pester -Path tests/module/integration -CI -Output Detailed

      - name: Roda os testes (Windows PowerShell 5.1)
        if: success() || steps.testes-powershell-7.conclusion == 'failure'
        shell: powershell
        run: Invoke-Pester -Path tests/module/integration -CI -Output Detailed

  testes-e2e-por-edicao:
    name: Testes e2e (${{ matrix.edicao.nome }})
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WINPLAYBOOK_TEST_MAQUINA_DESCARTAVEL: 'sim'
    strategy:
      fail-fast: false
      matrix:
        edicao:
          - nome: PowerShell 7
            shell: pwsh
          - nome: Windows PowerShell 5.1
            shell: powershell
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7

      - name: Instala as dependências de teste
        uses: ./.github/actions/instala-dependencias-de-teste

      - name: Restaura a distribuição de testes do cache
        id: cache-da-distribuicao
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\distribuicao-de-testes
          key: distribuicao-de-testes-${{ hashFiles('module/WinPlaybook/Private/Wsl/New-DistribuicaoDoWinPlaybook.ps1', 'module/WinPlaybook/Private/Wsl/Initialize-DistribuicaoDoWinPlaybook.ps1', 'module/WinPlaybook/Private/Wsl/Install-AnsibleNaDistribuicao.ps1', 'module/WinPlaybook/Private/Path/Get-ScriptDosCaminhosDoWindows.ps1', 'tests/module/helpers/Wsl.ps1') }}

      - name: Troca o módulo pelo pacote publicado
        run: |
          $pacote = ./scripts/Build-PacoteDoModulo.ps1 -Versao 0.0.0 -PastaDeDestino (Join-Path $env:RUNNER_TEMP 'pacote')
          Remove-Item -LiteralPath module/WinPlaybook -Recurse -Force
          Copy-Item -LiteralPath $pacote -Destination module/WinPlaybook -Recurse

      - name: Importa a distribuição de testes do cache
        if: steps.cache-da-distribuicao.outputs.cache-hit == 'true'
        run: |
          $pasta = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WinPlaybookTestes\WinPlaybookE2E'
          $null = New-Item -ItemType Directory -Path $pasta -Force
          $disco = Join-Path $pasta 'ext4.vhdx'
          Move-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'distribuicao-de-testes\ext4.vhdx') -Destination $disco
          wsl --import-in-place WinPlaybookE2E $disco
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepara a distribuição de testes
        run: |
          Import-Module Pester
          Import-Module ./module/WinPlaybook/WinPlaybook.psd1
          . ./tests/module/helpers/Wsl.ps1
          $null = Initialize-DistribuicaoWslDeTeste

      - name: Exporta a distribuição de testes
        if: steps.cache-da-distribuicao.outputs.cache-hit != 'true'
        run: |
          $pasta = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'distribuicao-de-testes') -Force
          wsl --shutdown
          wsl --export WinPlaybookE2E (Join-Path $pasta 'ext4.vhdx') --vhd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guarda a distribuição de testes no cache
        if: steps.cache-da-distribuicao.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\distribuicao-de-testes
          key: ${{ steps.cache-da-distribuicao.outputs.cache-primary-key }}

      - name: Roda os testes (PowerShell 7)
        if: matrix.edicao.shell == 'pwsh'
        run: Invoke-Pester -Path tests/module/e2e -CI -Output Detailed

      - name: Roda os testes (Windows PowerShell 5.1)
        if: matrix.edicao.shell == 'powershell'
        shell: powershell
        run: Invoke-Pester -Path tests/module/e2e -CI -Output Detailed

  testes-e2e:
    name: Testes e2e
    needs: testes-e2e-por-edicao
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confere as duas edições
        shell: bash
        run: test "${{ needs.testes-e2e-por-edicao.result }}" = success

  versao:
    name: Versão
    needs: [testes-unitarios, testes-de-integracao, testes-e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deve_lancar: ${{ steps.dados_do_release.outputs.deve_lancar }}
      tag: ${{ steps.dados_do_release.outputs.tag }}
      versao: ${{ steps.dados_do_release.outputs.versao }}

    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcula a próxima versão
        id: proxima_versao
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --tag-pattern "^v[0-9]"
            --bumped-version

      - name: Compara com o último release
        id: dados_do_release
        env:
          PROXIMA_TAG: ${{ steps.proxima_versao.outputs.content }}
        run: |
          $proximaTag = $env:PROXIMA_TAG.Trim()
          $ultimaTag = git tag --list 'v[0-9]*' --merged HEAD --sort=-version:refname | Select-Object -First 1
          $versao = [version] ($proximaTag -replace '^v')
          $deveLancar = if ($proximaTag -eq $ultimaTag) { 'false' } else { 'true' }

          Write-Host "Última: $($ultimaTag ?? 'nenhuma'). Próxima: $proximaTag. Deve lançar: $deveLancar."
          @(
              "deve_lancar=$deveLancar"
              "tag=$proximaTag"
              "versao=$versao"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  publicacao:
    name: Publicação
    needs: versao
    if: needs.versao.outputs.deve_lancar == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ needs.versao.outputs.tag }}
      VERSAO: ${{ needs.versao.outputs.versao }}

    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gera as notas de release
        uses: orhun/git-cliff-action@v4
        with:
          args: >-
            --tag-pattern "^v[0-9]"
            --unreleased
            --bump
            --strip all
            --output release-notes.md

      - name: Prepara o módulo
        id: preparacao
        run: |
          $caminhoDoModulo = ./scripts/Build-PacoteDoModulo.ps1 -Versao $env:VERSAO -PastaDeDestino $env:RUNNER_TEMP
          "caminho_do_modulo=$caminhoDoModulo" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Publica na PowerShell Gallery
        env:
          CAMINHO_DO_MODULO: ${{ steps.preparacao.outputs.caminho_do_modulo }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-PSResource -Path $env:CAMINHO_DO_MODULO -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

      - name: Cria o release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG --title "WinPlaybook $env:VERSAO" --notes-file release-notes.md --target $env:GITHUB_SHA
