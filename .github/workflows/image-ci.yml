name: Image CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: image-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  integration-tests:
    name: Image integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: Install-PSResource -RequiredResourceFile requirements.psd1 -TrustRepository -Quiet

      - name: Run integration tests
        run: Invoke-Pester -Path tests/integration -CI -Output Detailed
