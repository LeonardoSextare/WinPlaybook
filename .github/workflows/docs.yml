name: Docs

on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build both languages
        run: |
          foreach ($configFile in 'docs/zensical.en.toml', 'docs/zensical.pt-br.toml') {
              uvx zensical build --config-file $configFile
              if ($LASTEXITCODE -ne 0) {
                  throw "The build of $configFile failed."
              }
          }
          Copy-Item docs/index.html -Destination docs/site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
