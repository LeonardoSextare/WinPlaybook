name: Documentação

on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentacao-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  geracao:
    name: Geração
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7

      - name: Instala o uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Gera os dois idiomas
        run: |
          foreach ($arquivoDeConfiguracao in 'docs/zensical.en.toml', 'docs/zensical.pt-br.toml') {
              uvx zensical build --config-file $arquivoDeConfiguracao
              $gerouOSite = $LASTEXITCODE -eq 0
              if (-not $gerouOSite) {
                  throw "A geração do $arquivoDeConfiguracao falhou."
              }
          }
          Copy-Item -LiteralPath docs/index.html -Destination docs/site

      - name: Envia o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  publicacao:
    name: Publicação
    needs: geracao
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Publica no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
